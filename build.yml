name: Build APK Torche Shake

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Creer le projet Android
        run: |
          mkdir -p app
          cat > app/build.gradle.kts << 'EOF_TORCHE'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.torcheshake.app"
              compileSdk = 34

              defaultConfig {
                  applicationId = "com.torcheshake.app"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
              }

              buildTypes {
                  release {
                      isMinifyEnabled = false
                  }
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }
          }
          EOF_TORCHE
          mkdir -p app/src/main
          cat > app/src/main/AndroidManifest.xml << 'EOF_TORCHE'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:tools="http://schemas.android.com/tools">

              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_SPECIAL_USE" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />
              <uses-permission android:name="android.permission.WAKE_LOCK" />
              <uses-permission android:name="android.permission.VIBRATE" />
              <uses-permission android:name="android.permission.REQUEST_IGNORE_BATTERY_OPTIMIZATIONS" />

              <uses-feature
                  android:name="android.hardware.camera.flash"
                  android:required="true" />

              <application
                  android:allowBackup="true"
                  android:icon="@mipmap/ic_launcher"
                  android:label="@string/app_name"
                  android:roundIcon="@mipmap/ic_launcher"
                  android:supportsRtl="true"
                  android:theme="@style/AppTheme">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <service
                      android:name=".ShakeService"
                      android:exported="false"
                      android:foregroundServiceType="specialUse">
                      <property
                          android:name="android.app.PROPERTY_SPECIAL_USE_FGS_SUBTYPE"
                          android:value="Detection de secousses pour allumer la torche" />
                  </service>

                  <receiver
                      android:name=".BootReceiver"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.BOOT_COMPLETED" />
                          <action android:name="android.intent.action.MY_PACKAGE_REPLACED" />
                      </intent-filter>
                  </receiver>
              </application>
          </manifest>
          EOF_TORCHE
          mkdir -p app/src/main/java/com/torcheshake/app
          cat > app/src/main/java/com/torcheshake/app/BootReceiver.kt << 'EOF_TORCHE'
          package com.torcheshake.app

          import android.content.BroadcastReceiver
          import android.content.Context
          import android.content.Intent

          class BootReceiver : BroadcastReceiver() {
              override fun onReceive(context: Context, intent: Intent) {
                  val enabled = context.getSharedPreferences(ShakeService.PREFS, Context.MODE_PRIVATE)
                      .getBoolean(ShakeService.KEY_ENABLED, false)
                  if (enabled) {
                      try {
                          context.startForegroundService(Intent(context, ShakeService::class.java))
                      } catch (_: Exception) {
                      }
                  }
              }
          }
          EOF_TORCHE
          mkdir -p app/src/main/java/com/torcheshake/app
          cat > app/src/main/java/com/torcheshake/app/MainActivity.kt << 'EOF_TORCHE'
          package com.torcheshake.app

          import android.Manifest
          import android.app.Activity
          import android.content.Context
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.graphics.Color
          import android.graphics.Typeface
          import android.graphics.drawable.GradientDrawable
          import android.net.Uri
          import android.os.Build
          import android.os.Bundle
          import android.os.PowerManager
          import android.provider.Settings
          import android.view.Gravity
          import android.view.View
          import android.widget.Button
          import android.widget.LinearLayout
          import android.widget.TextView

          class MainActivity : Activity() {

              private lateinit var status: TextView
              private lateinit var mainBtn: Button

              private val prefs get() = getSharedPreferences(ShakeService.PREFS, Context.MODE_PRIVATE)

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  window.statusBarColor = Color.parseColor("#0F172A")
                  window.navigationBarColor = Color.parseColor("#0F172A")

                  val root = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      gravity = Gravity.CENTER
                      setBackgroundColor(Color.parseColor("#0F172A"))
                      setPadding(dp(28), dp(28), dp(28), dp(28))
                  }

                  val icon = TextView(this).apply {
                      text = "🔦"
                      textSize = 72f
                      gravity = Gravity.CENTER
                  }
                  val title = TextView(this).apply {
                      text = getString(R.string.app_name)
                      textSize = 28f
                      setTextColor(Color.WHITE)
                      typeface = Typeface.DEFAULT_BOLD
                      gravity = Gravity.CENTER
                  }
                  val hint = TextView(this).apply {
                      text = getString(R.string.hint)
                      textSize = 16f
                      setTextColor(Color.parseColor("#94A3B8"))
                      gravity = Gravity.CENTER
                      setPadding(0, dp(12), 0, dp(32))
                  }
                  status = TextView(this).apply {
                      textSize = 18f
                      typeface = Typeface.DEFAULT_BOLD
                      gravity = Gravity.CENTER
                      setPadding(0, 0, 0, dp(20))
                  }
                  mainBtn = styledButton("#FBBF24", Color.BLACK).apply {
                      setOnClickListener { toggleService() }
                  }
                  val batteryBtn = styledButton("#1E293B", Color.WHITE).apply {
                      text = getString(R.string.battery_btn)
                      setOnClickListener { askIgnoreBattery() }
                  }

                  root.addView(icon)
                  root.addView(title)
                  root.addView(hint)
                  root.addView(status)
                  root.addView(mainBtn, matchWidth())
                  root.addView(space())
                  root.addView(batteryBtn, matchWidth())
                  setContentView(root)

                  if (Build.VERSION.SDK_INT >= 33 &&
                      checkSelfPermission(Manifest.permission.POST_NOTIFICATIONS) != PackageManager.PERMISSION_GRANTED
                  ) {
                      requestPermissions(arrayOf(Manifest.permission.POST_NOTIFICATIONS), 1)
                  }
              }

              override fun onResume() {
                  super.onResume()
                  refreshUi()
              }

              private fun toggleService() {
                  val enabled = prefs.getBoolean(ShakeService.KEY_ENABLED, false)
                  val intent = Intent(this, ShakeService::class.java)
                  if (enabled) {
                      stopService(intent)
                      prefs.edit().putBoolean(ShakeService.KEY_ENABLED, false).apply()
                  } else {
                      startForegroundService(intent)
                      prefs.edit().putBoolean(ShakeService.KEY_ENABLED, true).apply()
                  }
                  refreshUi()
              }

              private fun refreshUi() {
                  val enabled = prefs.getBoolean(ShakeService.KEY_ENABLED, false)
                  if (enabled) {
                      status.text = getString(R.string.status_on)
                      status.setTextColor(Color.parseColor("#4ADE80"))
                      mainBtn.text = getString(R.string.btn_stop)
                  } else {
                      status.text = getString(R.string.status_off)
                      status.setTextColor(Color.parseColor("#F87171"))
                      mainBtn.text = getString(R.string.btn_start)
                  }
              }

              private fun askIgnoreBattery() {
                  val pm = getSystemService(Context.POWER_SERVICE) as PowerManager
                  if (!pm.isIgnoringBatteryOptimizations(packageName)) {
                      try {
                          startActivity(
                              Intent(Settings.ACTION_REQUEST_IGNORE_BATTERY_OPTIMIZATIONS)
                                  .setData(Uri.parse("package:$packageName"))
                          )
                      } catch (_: Exception) {
                          startActivity(Intent(Settings.ACTION_IGNORE_BATTERY_OPTIMIZATION_SETTINGS))
                      }
                  }
              }

              private fun styledButton(bg: String, fg: Int): Button = Button(this).apply {
                  setTextColor(fg)
                  textSize = 17f
                  typeface = Typeface.DEFAULT_BOLD
                  isAllCaps = false
                  background = GradientDrawable().apply {
                      setColor(Color.parseColor(bg))
                      cornerRadius = dp(16).toFloat()
                  }
                  minimumHeight = dp(56)
              }

              private fun matchWidth() = LinearLayout.LayoutParams(
                  LinearLayout.LayoutParams.MATCH_PARENT, LinearLayout.LayoutParams.WRAP_CONTENT
              )

              private fun space() = View(this).apply {
                  layoutParams = LinearLayout.LayoutParams(1, dp(12))
              }

              private fun dp(v: Int) = (v * resources.displayMetrics.density).toInt()
          }
          EOF_TORCHE
          mkdir -p app/src/main/java/com/torcheshake/app
          cat > app/src/main/java/com/torcheshake/app/ShakeService.kt << 'EOF_TORCHE'
          package com.torcheshake.app

          import android.app.Notification
          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.app.PendingIntent
          import android.app.Service
          import android.content.Context
          import android.content.Intent
          import android.content.pm.ServiceInfo
          import android.hardware.Sensor
          import android.hardware.SensorEvent
          import android.hardware.SensorEventListener
          import android.hardware.SensorManager
          import android.hardware.camera2.CameraCharacteristics
          import android.hardware.camera2.CameraManager
          import android.os.Build
          import android.os.IBinder
          import android.os.PowerManager
          import android.os.VibrationEffect
          import android.os.Vibrator
          import kotlin.math.sqrt

          class ShakeService : Service(), SensorEventListener {

              companion object {
                  const val CHANNEL_ID = "torche_shake"
                  const val NOTIF_ID = 1
                  const val PREFS = "torche_prefs"
                  const val KEY_ENABLED = "enabled"

                  // Reglages de la detection
                  const val SHAKES_REQUIRED = 5          // nombre de secousses
                  const val SHAKE_THRESHOLD_G = 2.4f     // force minimale d'une secousse
                  const val MIN_GAP_MS = 150L            // delai mini entre 2 secousses
                  const val MAX_GAP_MS = 900L            // delai maxi entre 2 secousses
                  const val COOLDOWN_MS = 1500L          // pause apres un basculement
              }

              private lateinit var sensorManager: SensorManager
              private lateinit var cameraManager: CameraManager
              private var cameraId: String? = null
              private var torchOn = false

              private var shakeCount = 0
              private var lastShakeTime = 0L
              private var lastToggleTime = 0L

              private var wakeLock: PowerManager.WakeLock? = null

              private val torchCallback = object : CameraManager.TorchCallback() {
                  override fun onTorchModeChanged(id: String, enabled: Boolean) {
                      if (id == cameraId) torchOn = enabled
                  }
              }

              override fun onCreate() {
                  super.onCreate()
                  sensorManager = getSystemService(Context.SENSOR_SERVICE) as SensorManager
                  cameraManager = getSystemService(Context.CAMERA_SERVICE) as CameraManager

                  cameraId = cameraManager.cameraIdList.firstOrNull { id ->
                      val c = cameraManager.getCameraCharacteristics(id)
                      c.get(CameraCharacteristics.FLASH_INFO_AVAILABLE) == true &&
                          c.get(CameraCharacteristics.LENS_FACING) == CameraCharacteristics.LENS_FACING_BACK
                  } ?: cameraManager.cameraIdList.firstOrNull { id ->
                      cameraManager.getCameraCharacteristics(id)
                          .get(CameraCharacteristics.FLASH_INFO_AVAILABLE) == true
                  }

                  cameraManager.registerTorchCallback(torchCallback, null)

                  val pm = getSystemService(Context.POWER_SERVICE) as PowerManager
                  wakeLock = pm.newWakeLock(PowerManager.PARTIAL_WAKE_LOCK, "TorcheShake::shake").apply {
                      setReferenceCounted(false)
                      acquire()
                  }

                  createChannel()
                  val notif = buildNotification()
                  if (Build.VERSION.SDK_INT >= 34) {
                      startForeground(NOTIF_ID, notif, ServiceInfo.FOREGROUND_SERVICE_TYPE_SPECIAL_USE)
                  } else {
                      startForeground(NOTIF_ID, notif)
                  }

                  val accel = sensorManager.getDefaultSensor(Sensor.TYPE_ACCELEROMETER)
                  if (accel != null) {
                      sensorManager.registerListener(this, accel, SensorManager.SENSOR_DELAY_GAME)
                  }
              }

              override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int = START_STICKY

              override fun onBind(intent: Intent?): IBinder? = null

              override fun onDestroy() {
                  sensorManager.unregisterListener(this)
                  cameraManager.unregisterTorchCallback(torchCallback)
                  wakeLock?.let { if (it.isHeld) it.release() }
                  super.onDestroy()
              }

              override fun onSensorChanged(event: SensorEvent) {
                  val x = event.values[0] / SensorManager.GRAVITY_EARTH
                  val y = event.values[1] / SensorManager.GRAVITY_EARTH
                  val z = event.values[2] / SensorManager.GRAVITY_EARTH
                  val gForce = sqrt(x * x + y * y + z * z)
                  if (gForce < SHAKE_THRESHOLD_G) return

                  val now = System.currentTimeMillis()
                  if (now - lastToggleTime < COOLDOWN_MS) return
                  if (now - lastShakeTime < MIN_GAP_MS) return

                  if (now - lastShakeTime > MAX_GAP_MS) shakeCount = 0
                  lastShakeTime = now
                  shakeCount++

                  if (shakeCount >= SHAKES_REQUIRED) {
                      shakeCount = 0
                      lastToggleTime = now
                      toggleTorch()
                  }
              }

              override fun onAccuracyChanged(sensor: Sensor?, accuracy: Int) {}

              private fun toggleTorch() {
                  val id = cameraId ?: return
                  try {
                      cameraManager.setTorchMode(id, !torchOn)
                      vibrate()
                  } catch (_: Exception) {
                  }
              }

              private fun vibrate() {
                  val v = getSystemService(Context.VIBRATOR_SERVICE) as Vibrator
                  if (v.hasVibrator()) {
                      v.vibrate(VibrationEffect.createOneShot(80, VibrationEffect.DEFAULT_AMPLITUDE))
                  }
              }

              private fun createChannel() {
                  val nm = getSystemService(Context.NOTIFICATION_SERVICE) as NotificationManager
                  val ch = NotificationChannel(
                      CHANNEL_ID, getString(R.string.channel_name), NotificationManager.IMPORTANCE_LOW
                  )
                  nm.createNotificationChannel(ch)
              }

              private fun buildNotification(): Notification {
                  val pi = PendingIntent.getActivity(
                      this, 0, Intent(this, MainActivity::class.java),
                      PendingIntent.FLAG_IMMUTABLE or PendingIntent.FLAG_UPDATE_CURRENT
                  )
                  return Notification.Builder(this, CHANNEL_ID)
                      .setContentTitle(getString(R.string.app_name))
                      .setContentText(getString(R.string.notif_text))
                      .setSmallIcon(R.drawable.ic_flash)
                      .setContentIntent(pi)
                      .setOngoing(true)
                      .build()
              }
          }
          EOF_TORCHE
          mkdir -p app/src/main/res/drawable
          cat > app/src/main/res/drawable/ic_flash.xml << 'EOF_TORCHE'
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="24"
              android:viewportHeight="24">
              <path
                  android:fillColor="#FBBF24"
                  android:pathData="M7,2h10v4l-2,3v13a1,1 0 0,1 -1,1h-4a1,1 0 0,1 -1,-1V9L7,6z" />
              <path
                  android:fillColor="#0F172A"
                  android:pathData="M11,11h2v4h-2z" />
          </vector>
          EOF_TORCHE
          mkdir -p app/src/main/res/mipmap-anydpi-v26
          cat > app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml << 'EOF_TORCHE'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/ic_bg" />
              <foreground android:drawable="@drawable/ic_flash" />
          </adaptive-icon>
          EOF_TORCHE
          mkdir -p app/src/main/res/values
          cat > app/src/main/res/values/strings.xml << 'EOF_TORCHE'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">Torche Shake</string>
              <string name="hint">Secouez le téléphone 5 fois pour allumer la torche. Secouez 5 fois de nouveau pour l\'éteindre.</string>
              <string name="status_on">● Détection activée</string>
              <string name="status_off">● Détection désactivée</string>
              <string name="btn_start">Activer</string>
              <string name="btn_stop">Désactiver</string>
              <string name="battery_btn">Fonctionner en arrière-plan (batterie)</string>
              <string name="channel_name">Détection de secousses</string>
              <string name="notif_text">Secouez 5 fois pour allumer ou éteindre la torche</string>
          </resources>
          EOF_TORCHE
          mkdir -p app/src/main/res/values
          cat > app/src/main/res/values/styles.xml << 'EOF_TORCHE'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="AppTheme" parent="android:Theme.Material.NoActionBar" />
              <color name="ic_bg">#0F172A</color>
          </resources>
          EOF_TORCHE
          cat > build.gradle.kts << 'EOF_TORCHE'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF_TORCHE
          cat > gradle.properties << 'EOF_TORCHE'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=false
          kotlin.code.style=official
          EOF_TORCHE
          cat > settings.gradle.kts << 'EOF_TORCHE'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "TorcheShake"
          include(":app")
          EOF_TORCHE

      - name: Compiler l'APK
        run: gradle assembleDebug --no-daemon

      - name: Envoyer l'APK
        uses: actions/upload-artifact@v4
        with:
          name: TorcheShake-APK
          path: app/build/outputs/apk/debug/app-debug.apk
